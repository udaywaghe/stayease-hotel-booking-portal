spring.application.name=stayease-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stayease_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
stayease.ai.provider=${STAYEASE_AI_PROVIDER:local}
stayease.ai.openai.api-key=${OPENAI_API_KEY:}
stayease.ai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
